<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
   <link href="src/output.css" rel="stylesheet">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
   <title>Frontend Mentor | NFT preview card component</title>

</head>
<body>
 
  <div class="max-w-[100vw] min-h-screen w-full h-full flex flex-col items-center justify-center bg-bgmain text-white font-[15px] font-main">
  <!--Card-->
  <div class="md:w-[20em] w-20 flex flex-col items-start justify-start p-6 bg-bgcard rounded-2xl gap-4">
    <!--Picture-->
  <div>
    <img src="images/image-equilibrium.jpg" class="w-full rounded-2xl">
  </div>
    <!--Description-->
    <div class="flex flex-col items-start justify-start text-start gap-4 text-textblue">
      <h4 class="font-bold text-white">Equilibrium #3429</h4>
      <p>Our Equilibrium collection promotes balance and calm.</p>
       <div class=" w-full flex flex-row items-center justify-between">
        <div class="flex gap-2"><img src="/images/icon-ethereum.svg"><p class="text-textcyan">0.041 ETH</p></div>
        <div class="flex gap-2 items-center justify-center"><img src="/images/icon-clock.svg" class="w-4 h-4"><p>3 days left</p></div>
      </div>
    </div>
    <!--Line-->
    <hr class="w-full border-white border-[1px]">

  </div>

  

  <!--
  Equilibrium #3429

  Our Equilibrium collection promotes balance and calm.

  0.041 ETH
  3 days left
  
  Creation of Jules Wyvern
-->

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
 
</div>
</body>
</html>
